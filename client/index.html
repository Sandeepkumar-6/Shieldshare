<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Share-link URLs carry a secret: never send the page URL as a Referer -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="ShieldShare: secure file sharing with behavioral ransomware detection and recovery." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ShieldShare</title>
    <!-- Apply a saved light theme before the first paint (state/ThemeContext.jsx owns it after). -->
    <script>
      try { if (localStorage.getItem('shieldshare.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
